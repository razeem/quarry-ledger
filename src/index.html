<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quarry Ledger</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Offline-first ledger for quarry load brokerage." />
    <meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />

    <!-- PWA: installable + offline (service worker registered in app.config.ts) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ledger" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <!--
      Link previews. These URLs must be absolute and cannot use <base href>:
      crawlers do not resolve it, and the Pages build rewrites it to the repo
      subpath anyway. Update them if the site ever moves.
      Regenerate the card with `node scripts/generate-og-image.mjs`.
      Twitter falls back to the og:* tags, so only the card type is repeated.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quarry Ledger" />
    <meta property="og:title" content="Quarry Ledger" />
    <meta property="og:description" content="Offline-first ledger for quarry load brokerage." />
    <meta property="og:url" content="https://razeem.github.io/quarry-ledger/" />
    <meta property="og:image" content="https://razeem.github.io/quarry-ledger/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Quarry Ledger — an offline-first ledger for quarry load brokerage."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"
      rel="stylesheet"
    />
  </head>
  <body class="mat-typography">
    <app-root></app-root>
  </body>
</html>
